services:
  - type: web
    name: podsadministrator-research-etl-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apis/research-etl
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        sync: false
